name: publish to PyPI

# Runs when a GitHub release is published. Requires a PyPI "trusted publisher"
# for project gang-mof pointing at this repository and workflow (see docs/RELEASING.md).
on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
